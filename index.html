<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPG ADMIN - Panel Giftów i Rang</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- BIBLIOTEKI FIREBASE -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Press Start 2P', monospace; }
        body { 
            background-color: #000; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-image: radial-gradient(circle, #2C1A0E 10%, #000 80%);
            padding: 20px;
        }
        
        .admin-panel { 
            background: #5E3A21; 
            border: 4px solid #3A2313; 
            border-radius: 8px; 
            padding: 20px; 
            text-align: center; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 5px 25px rgba(0,0,0,0.9); 
            width: 100%; 
            max-width: 350px; 
        }
        
        h2 { font-size: 11px; color: #FF9800; margin-bottom: 15px; text-shadow: 2px 2px 0 #000; line-height: 1.5; }
        
        .input-group { text-align: left; margin-bottom: 12px; }
        .input-group label { font-size: 7px; color: #FFD700; display: block; margin-bottom: 4px; }
        
        input, select { 
            width: 100%; 
            padding: 10px; 
            background: #2C1A0E; 
            border: 2px solid #8B5A2B; 
            color: #fff; 
            font-size: 9px; 
            outline: none; 
            border-radius: 4px; 
        }
        
        .btn { 
            background: #9C27B0; 
            border: 4px solid #7B1FA2; 
            color: white; 
            padding: 12px; 
            font-size: 9px; 
            text-transform: uppercase; 
            cursor: pointer; 
            box-shadow: 0 4px 0 #4A148C; 
            border-radius: 4px; 
            text-shadow: 2px 2px 0px #000; 
            width: 100%;
            margin-top: 5px;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn:active { 
            transform: translateY(4px); 
            box-shadow: 0 0 0 #4A148C; 
        }

        #status-msg, #login-status {
            margin-top: 12px;
            font-size: 8px;
            line-height: 1.4;
            min-height: 20px;
        }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .loading { color: #2196F3; }
        
        .section-divider {
            border: 0;
            height: 2px;
            background: #3A2313;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <!-- EKRAN LOGOWANIA ADMINA -->
    <div class="admin-panel" id="login-box">
        <h2>🔒 PANEL ADMINA<br>AUTORYZACJA</h2>
        
        <div class="input-group">
            <label>EMAIL ADMINA:</label>
            <input type="email" id="admin-email" placeholder="admin@game.com">
        </div>

        <div class="input-group">
            <label>HASŁO / PIN:</label>
            <input type="password" id="admin-pass" placeholder="••••••••">
        </div>

        <button class="btn" onclick="loginAdmin()">ZALOGUJ SIĘ</button>
        <div id="login-status"></div>
    </div>

    <!-- PANEL AKCJI (DOMYŚLNIE UKRYTY) -->
    <div class="admin-panel" id="main-panel" style="display: none;">
        <h2>🎁 ADMIN PANEL<br>GIFTY & RANGI</h2>
        
        <div class="input-group">
            <label>NICK GRACZA:</label>
            <input type="text" id="target-nick" placeholder="Wpisz nick..." autocomplete="off">
        </div>

        <hr class="section-divider">

        <div class="input-group">
            <label>TYP PREZENTU:</label>
            <select id="gift-type" onchange="toggleGiftFields()">
                <option value="resource">Surowce / Itemy</option>
                <option value="rank">Specjalna Ranga</option>
            </select>
        </div>

        <div id="resource-options">
            <div class="input-group">
                <label>WYBIERZ SUROWIEC:</label>
                <select id="gift-res">
                    <option value="plank">🪵 Drewno (Plank)</option>
                    <option value="stone">🪨 Kamień (Stone)</option>
                    <option value="meat">🍖 Mięso (Meat)</option>
                    <option value="metal">⚙️ Metal</option>
                    <option value="diamond">💎 Diament (Diamond)</option>
                    <option value="mythril">🔮 Mithril (Mythril)</option>
                </select>
            </div>
            <div class="input-group">
                <label>ILOŚĆ:</label>
                <input type="number" id="gift-amount" placeholder="Np. 100" min="1" value="1">
            </div>
        </div>

        <div id="rank-options" style="display: none;">
            <div class="input-group">
                <label>WYBIERZ RANGĘ:</label>
                <select id="gift-rank-name">
                    <option value="VIP">VIP</option>
                    <option value="SNAJPER">SNAJPER</option>
                    <option value="OWNER">OWNER</option>
                    <option value="PLAYER">PLAYER (Reset)</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="sendGift()">WYŚLIJ DO GRACZA</button>
        <button class="btn" style="background: #f44336; border-color: #d32f2f; margin-top: 10px;" onclick="logoutAdmin()">WYLOGUJ</button>
        
        <div id="status-msg"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDbVxlkWCzXBmsnQ5uvFpuW91Xevf2ZR54",
            authDomain: "dungeons-and-experiments.firebaseapp.com",
            projectId: "dungeons-and-experiments",
            storageBucket: "dungeons-and-experiments.firebasestorage.app",
            messagingSenderId: "104990230475",
            appId: "1:104990230475:web:58e9dcca6be7a434ded84e"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // Sprawdzanie stanu zalogowania
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById("login-box").style.display = "none";
                document.getElementById("main-panel").style.display = "block";
            } else {
                document.getElementById("login-box").style.display = "block";
                document.getElementById("main-panel").style.display = "none";
            }
        });

        async function loginAdmin() {
            let email = document.getElementById("admin-email").value;
            let pass = document.getElementById("admin-pass").value;
            let status = document.getElementById("login-status");

            status.className = "loading";
            status.innerText = "Logowanie...";

            try {
                await auth.signInWithEmailAndPassword(email, pass);
                status.className = "success";
                status.innerText = "Zalogowano!";
            } catch (e) {
                status.className = "error";
                status.innerText = "Błąd: " + e.message;
            }
        }

        function logoutAdmin() {
            auth.signOut();
        }

        function toggleGiftFields() {
            let type = document.getElementById("gift-type").value;
            if (type === "resource") {
                document.getElementById("resource-options").style.display = "block";
                document.getElementById("rank-options").style.display = "none";
            } else {
                document.getElementById("resource-options").style.display = "none";
                document.getElementById("rank-options").style.display = "block";
            }
        }

        async function sendGift() {
            let nick = document.getElementById("target-nick").value.trim();
            let giftType = document.getElementById("gift-type").value;
            let status = document.getElementById("status-msg");

            status.className = "";
            status.innerText = "";

            if (!nick) {
                status.className = "error";
                status.innerText = "Błąd: Wpisz nick gracza!";
                return;
            }

            status.className = "loading";
            status.innerText = "Łączenie z bazą...";

            try {
                let targetRef = db.collection("users").doc(nick);
                let snap = await targetRef.get();
                
                if (!snap.exists) {
                    status.className = "error";
                    status.innerText = "Błąd: Gracz '" + nick + "' nie istnieje!";
                    return;
                }

                let gift = {
                    id: Date.now(),
                    from: "ADMIN",
                    type: giftType
                };

                if (giftType === "resource") {
                    let resType = document.getElementById("gift-res").value;
                    let amount = parseInt(document.getElementById("gift-amount").value);
                    
                    if (!amount || amount <= 0) {
                        status.className = "error";
                        status.innerText = "Błąd: Podaj poprawną ilość!";
                        return;
                    }
                    gift.resType = resType;
                    gift.resAmount = amount;
                } else {
                    let rankName = document.getElementById("gift-rank-name").value;
                    gift.rankName = rankName;
                }

                await targetRef.update({
                    inbox: firebase.firestore.FieldValue.arrayUnion(gift)
                });

                status.className = "success";
                status.innerText = `Sukces! Wysłano prezent do gracza ${nick}.`;
                document.getElementById("target-nick").value = "";
                
            } catch (e) {
                status.className = "error";
                status.innerText = "Wystąpił błąd: " + e.message;
            }
        }
    </script>
</body>
</html>
